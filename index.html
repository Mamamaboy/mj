<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理システム - 一括入力版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🀄 麻雀成績管理（一括入力）</h1>

        <section class="card setting-section">
            <h2>基本設定</h2>
            <div class="settings-grid">
                <div class="names">
                    <label>P1: <input type="text" id="p1-name" value="Aさん"></label>
                    <label>P2: <input type="text" id="p2-name" value="Bさん"></label>
                    <label>P3: <input type="text" id="p3-name" value="Cさん"></label>
                    <label>P4: <input type="text" id="p4-name" value="Dさん"></label>
                </div>
                <div class="rules">
                    <label>配点: <input type="number" id="start-point" value="25000"></label>
                    <label>返し: <input type="number" id="return-point" value="30000"></label>
                    <label>ウマ(1-4位): <input type="text" id="uma" value="10,5,-5,-10"></label>
                    <label>レート(1pt=○円): <input type="number" id="rate" value="50"></label>
                    <label>チップ(1枚=○円): <input type="number" id="chip-rate" value="500"></label>
                </div>
            </div>
        </section>

        <section class="card score-section">
            <h2>点数入力（1〜20回戦）</h2>
            <div class="table-wrapper">
                <table id="score-table">
                    <thead>
                        <tr><th>回</th><th class="p1-label">Aさん</th><th class="p2-label">Bさん</th><th class="p3-label">Cさん</th><th class="p4-label">Dさん</th></tr>
                    </thead>
                    <tbody id="score-body"></tbody>
                </table>
            </div>
        </section>

        <button class="calc-btn" onclick="calculateAll()">全計算を実行する</button>

        <section class="card point-section">
            <h2>ポイント計算結果（ウマ・オカ・チップ込）</h2>
            <div class="table-wrapper">
                <table id="point-table">
                    <thead>
                        <tr><th>回</th><th class="p1-label">Aさん</th><th class="p2-label">Bさん</th><th class="p3-label">Cさん</th><th class="p4-label">Dさん</th></tr>
                    </thead>
                    <tbody id="point-body"></tbody>
                    <tfoot>
                        <tr class="chip-row">
                            <td>チップ</td>
                            <td><input type="number" id="chip1" value="0"></td>
                            <td><input type="number" id="chip2" value="0"></td>
                            <td><input type="number" id="chip3" value="0"></td>
                            <td><input type="number" id="chip4" value="0"></td>
                        </tr>
                        <tr class="total-row">
                            <td>合計pt</td><td id="total-pt1">0</td><td id="total-pt2">0</td><td id="total-pt3">0</td><td id="total-pt4">0</td>
                        </tr>
                        <tr class="money-row">
                            <td>円精算</td><td id="money1">¥0</td><td id="money2">¥0</td><td id="money3">¥0</td><td id="money4">¥0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section class="card rank-section">
            <h2>順位表・統計</h2>
            <div class="table-wrapper">
                <table id="rank-table">
                    <thead>
                        <tr><th>回</th><th class="p1-label">Aさん</th><th class="p2-label">Bさん</th><th class="p3-label">Cさん</th><th class="p4-label">Dさん</th></tr>
                    </thead>
                    <tbody id="rank-body"></tbody>
                    <tfoot>
                        <tr class="avg-rank-row">
                            <td>平均順位</td><td id="avg-rank1">-</td><td id="avg-rank2">-</td><td id="avg-rank3">-</td><td id="avg-rank4">-</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
