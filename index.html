<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理システム V3.3 - M.LEAGUEデザイン</title>
    <style>
        /* 基本設定：白基調 */
        body { font-family: sans-serif; background: #ffffff; margin: 0; padding: 20px; color: #000000; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* アプリケーションヘッダーとロゴ */
        .app-header { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .app-logo { height: 40px; margin-right: 15px; }
        h1 { text-align: center; color: #000000; margin: 0; font-size: 1.8em; }

        /* カードデザイン：白、境界線グレー、影なし */
        .card { background: #ffffff; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 20px; }
        
        /* セクションタイトル：サイドバー交互（緑・赤・緑・赤） */
        h2 { font-size: 1.2em; border-left: 5px solid #000000; padding-left: 10px; margin-bottom: 15px; }
        #setting-section h2 { border-left-color: #007a33; } /* 基本設定：緑 */
        #score-section h2 { border-left-color: #e4002b; }   /* 点数入力：赤 */
        #point-section h2 { border-left-color: #007a33; }   /* ポイント結果：緑 */
        #rank-section h2 { border-left-color: #e4002b; }    /* 通算成績：赤 */

        /* 日付セレクター：白、境界線グレー */
        .date-selector { display: flex; align-items: center; gap: 10px; font-weight: bold; background: #ffffff; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; flex-wrap: wrap; flex: 1; }
        .date-selector input { padding: 8px; font-size: 1.1em; }
        
        /* ボタンカラー：保存＝緑、計算＝赤 */
        .save-btn { padding: 8px 15px; background: #007a33; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .save-btn:hover { background: #006629; }
        .calc-btn { width: 100%; padding: 15px; background: #e4002b; color: #ffffff; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(228, 0, 43, 0.3); transition: 0.2s; }
        .calc-btn:active { transform: translateY(2px); box-shadow: none; }
        .calc-btn:hover { background: #c30025; }

        /* その他ボタン */
        .reset-btn { padding: 8px 15px; background: #ef4444; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .reset-btn:hover { background: #dc2626; }
        .nav-btn { padding: 10px 20px; background: #3b82f6; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1em; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); transition: 0.2s; }
        .nav-btn:hover { background: #2563eb; }
        .nav-btn:active { transform: translateY(2px); box-shadow: none; }
        .manual-btn { padding: 5px 8px; background: #6b7280; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; white-space: nowrap; }
        .manual-btn.active { background: #f59e0b; }

        /* 設定グリッド */
        .settings-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 2; min-width: 300px; }
        .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; min-width: 200px; }
        label { font-size: 0.8em; font-weight: bold; }
        input, select { width: 100%; padding: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }

        /* テーブル基本：白ヘッダー、境界線グレー、スクロール */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; min-width: 1050px; }
        th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: center; }
        
        /* ヘッダーデザイン：白背景、黒文字、太下線グレー */
        table thead th { background: #ffffff; color: #000000; font-weight: bold; white-space: nowrap; border-bottom: 2px solid #e0e0e0; }

        /* セクション別ヘッダー色（削除して白統一） */
        .score-section table thead th, .point-section table thead th, .rank-section table thead th { background: none; }

        /* 各種データ色同期（緑、赤、黒、グレー） */
        .sum-cell { font-weight: bold; color: #666666; background: none; } /* 合計：グレー */
        .sum-ok { color: #007a33; } /* 合計OK：緑 */
        .sum-err { color: #e4002b; } /* 合計ERROR：赤 */
        
        .total-row { font-weight: bold; background: #f3f4f6; } /* 当日Pt：薄グレー */
        .money-row { font-weight: bold; color: #007a33; font-size: 1.1em; } /* 当日収支：緑 */
        
        .tobi-select { width: 90px; padding: 4px; font-size: 0.9em; }
        .chip-row input { width: 60px; text-align: center; border: 1px solid #ddd; }

        /* ポイント表の入力枠（手入力モード） */
        .pt-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 1em; color: inherit; pointer-events: none; }
        .pt-input.manual-mode { pointer-events: auto; border: 2px solid #e4002b; background: #fffbeb; border-radius: 4px; padding: 4px; color: #b45309; font-weight: bold; }
        .pt-input::-webkit-outer-spin-button, .pt-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* その他：グラフ、画面切り替え */
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 10px; }
        #cumulative-view { display: none; }
        .save-note { font-size: 0.8em; color: #d97706; }
    </style>
</head>
