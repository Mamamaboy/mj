<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🀄 麻雀成績管理</h1>

        <section class="card">
            <h2>基本設定</h2>
            <div class="settings-grid">
                <label>参加者1: <input type="text" id="p1-name" value="Aさん"></label>
                <label>参加者2: <input type="text" id="p2-name" value="Bさん"></label>
                <label>参加者3: <input type="text" id="p3-name" value="Cさん"></label>
                <label>参加者4: <input type="text" id="p4-name" value="Dさん"></label>
                <label>配点: <input type="number" id="start-point" value="25000" step="1000"></label>
                <label>返し点: <input type="number" id="return-point" value="30000" step="1000"></label>
                <label>ウマ(1-4位): <input type="text" id="uma" value="20,10,-10,-20" placeholder="カンマ区切り"></label>
                <label>レート(1pt=○円): <input type="number" id="rate" value="50"></label>
                <label>チップレート(1枚=○円): <input type="number" id="chip-rate" value="500"></label>
            </div>
        </section>

        <section class="card">
            <h2>半荘入力</h2>
            <table class="input-table">
                <thead>
                    <tr>
                        <th>項目</th>
                        <th id="label-p1">Aさん</th>
                        <th id="label-p2">Bさん</th>
                        <th id="label-p3">Cさん</th>
                        <th id="label-p4">Dさん</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>持ち点 (半荘終了時)</td>
                        <td><input type="number" id="score1" value="35000" step="100"></td>
                        <td><input type="number" id="score2" value="25000" step="100"></td>
                        <td><input type="number" id="score3" value="20000" step="100"></td>
                        <td><input type="number" id="score4" value="20000" step="100"></td>
                    </tr>
                    <tr>
                        <td>チップ (枚数)</td>
                        <td><input type="number" id="chip1" value="2"></td>
                        <td><input type="number" id="chip2" value="0"></td>
                        <td><input type="number" id="chip3" value="-1"></td>
                        <td><input type="number" id="chip4" value="-1"></td>
                    </tr>
                </tbody>
            </table>
            <button onclick="calculate()">計算して記録する</button>
        </section>

        <section class="card">
            <h2>成績表（結果）</h2>
            <table class="result-table" id="result-table">
                <thead>
                    <tr>
                        <th>半荘</th>
                        <th>名前</th>
                        <th>点数</th>
                        <th>順位</th>
                        <th>Pt (ウマ・オカ込)</th>
                        <th>チップ</th>
                        <th>合計金額(目安)</th>
                    </tr>
                </thead>
                <tbody id="result-body">
                    </tbody>
            </table>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
