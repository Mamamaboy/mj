<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理システム V4 (グラフ搭載)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #064e3b; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2em; border-left: 5px solid #10b981; padding-left: 10px; margin-bottom: 15px; }

        .date-selector { display: flex; justify-content: center; align-items: center; gap: 15px; font-weight: bold; background: #ecfdf5; border: 2px solid #10b981; flex-wrap: wrap; }
        .date-selector input { padding: 8px; font-size: 1.1em; }
        .save-btn { padding: 8px 15px; background: #059669; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .save-note { font-size: 0.8em; color: #d97706; }

        .settings-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 2; min-width: 300px; }
        .rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1; min-width: 200px; }
        label { font-size: 0.8em; font-weight: bold; }
        input, select { width: 100%; padding: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        /* iPad等でスワイプできるように横幅を確保 */
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; min-width: 1050px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; white-space: nowrap; }

        .score-section table thead th { background: #d1fae5; }
        .point-section table thead th { background: #dbeafe; }
        .rank-section table thead th { background: #fef3c7; }

        .sum-cell { font-weight: bold; color: #6b7280; background: #f3f4f6; }
        .sum-ok { color: #10b981; }
        .sum-err { color: #ef4444; }

        .calc-btn { width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3); transition: 0.2s; }
        .calc-btn:active { transform: translateY(2px); box-shadow: none; }

        .total-row { font-weight: bold; background: #f3f4f6; }
        .money-row { font-weight: bold; color: #059669; font-size: 1.1em; }

        .tobi-select { width: 90px; padding: 4px; font-size: 0.9em; }
        .manual-btn { padding: 5px 8px; background: #6b7280; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; white-space: nowrap; }
        .manual-btn.active { background: #f59e0b; }

        .pt-input { width: 100%; border: none; background: transparent; text-align: center; font-size: 1em; color: inherit; pointer-events: none; }
        .pt-input.manual-mode { pointer-events: auto; border: 2px solid #f59e0b; background: #fffbeb; border-radius: 4px; padding: 4px; color: #b45309; font-weight: bold; }
        .pt-input::-webkit-outer-spin-button, .pt-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* グラフ用のエリア */
        .chart-container { position: relative; height: 350px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🀄 麻雀成績管理 V4</h1>

        <div class="date-selector card">
            <label for="game-date">📅 記録日を選択: </label>
            <input type="date" id="game-date">
            <button onclick="saveCurrentData()" class="save-btn">この日のデータを保存</button>
            <span class="save-note">※保存すると通算成績に反映されます</span>
        </div>

        <section class="card setting-section">
            <h2>基本設定 & メンバー（最大6名）</h2>
            <div class="settings-grid">
                <div class="names">
                    <label>P1: <input type="text" id="p1-name" value="Aさん"></label>
                    <label>P2: <input type="text" id="p2-name" value="Bさん"></label>
                    <label>P3: <input type="text" id="p3-name" value="Cさん"></label>
                    <label>P4: <input type="text" id="p4-name" value="Dさん"></label>
                    <label>P5: <input type="text" id="p5-name" value="Eさん"></label>
                    <label>P6: <input type="text" id="p6-name" value="Fさん"></label>
                </div>
                <div class="rules">
                    <label>配点: <input type="number" id="start-point" value="25000"></label>
                    <label>返し: <input type="number" id="return-point" value="30000"></label>
                    <label>ウマ: <input type="text" id="uma" value="10,5,-5,-10"></label>
                    <label>レート: <input type="number" id="rate" value="50"></label>
                    <label>チップ: <input type="number" id="chip-rate" value="500"></label>
                </div>
            </div>
        </section>

        <p style="text-align: right; font-size: 0.8em; color: #666; margin: 0 0 5px 0;">※表は横にスクロールできます 👉</p>

        <section class="card score-section">
            <h2>点数入力（休みの人は空欄）</h2>
            <div class="table-wrapper">
                <table id="score-table">
                    <thead>
                        <tr>
                            <th>回</th>
                            <th class="p1-label">Aさん</th><th class="p2-label">Bさん</th><th class="p3-label">Cさん</th>
                            <th class="p4-label">Dさん</th><th class="p5-label">Eさん</th><th class="p6-label">Fさん</th>
                            <th>合計</th>
                            <th>トビ賞</th>
                            <th>手入力</th>
                        </tr>
                    </thead>
                    <tbody id="score-body"></tbody>
                </table>
            </div>
        </section>

        <button class="calc-btn" onclick="calculateAll()">計算して画面とグラフに反映</button>

        <section class="card point-section">
            <h2>当日のポイント結果 (手入力ボタンで黄色い枠を直接編集)</h2>
            <div class="table-wrapper">
                <table id="point-table">
                    <thead>
                        <tr>
                            <th>回</th>
                            <th class="p1-label">Aさん</th><th class="p2-label">Bさん</th><th class="p3-label">Cさん</th>
                            <th class="p4-label">Dさん</th><th class="p5-label">Eさん</th><th class="p6-label">Fさん</th>
                        </tr>
                    </thead>
                    <tbody id="point-body"></tbody>
                    <tfoot>
                        <tr class="chip-row">
                            <td>チップ</td>
                            <td><input type="number" id="chip1" value="0"></td>
                            <td><input type="number" id="chip2" value="0"></td>
                            <td><input type="number" id="chip3" value="0"></td>
                            <td><input type="number" id="chip4" value="0"></td>
                            <td><input type="number" id="chip5" value="0"></td>
                            <td><input type="number" id="chip6" value="0"></td>
                        </tr>
                        <tr class="total-row">
                            <td>当日Pt</td><td id="total-pt1">0</td><td id="total-pt2">0</td><td id="total-pt3">0</td><td id="total-pt4">0</td><td id="total-pt5">0</td><td id="total-pt6">0</td>
                        </tr>
                        <tr class="money-row">
                            <td>当日収支</td><td id="money1">¥0</td><td id="money2">¥0</td><td id="money3">¥0</td><td id="money4">¥0</td><td id="money5">¥0</td><td id="money6">¥0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section class="card chart-section">
            <h2>📈 当日のポイント推移</h2>
            <div class="chart-container">
                <canvas id="pointChart"></canvas>
            </div>
        </section>

        <section class="card rank-section">
            <h2>🏆 通算成績（全日程の合計）</h2>
            <div class="table-wrapper">
                <table id="cumulative-table">
                    <thead>
                        <tr><th>名前</th><th>プレイ数</th><th>通算Pt</th><th>通算収支(目安)</th></tr>
                    </thead>
                    <tbody id="cumulative-body"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        const maxGames = 20;
        const numPlayers = 6;
        let db = JSON.parse(localStorage.getItem('mahjongDB')) || {};
        let manualRows = new Array(maxGames + 1).fill(false);
        let pointChart; // グラフの本体

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('game-date').value = today;
            
            const scoreBody = document.getElementById('score-body');
            const pointBody = document.getElementById('point-body');
            
            for (let i = 1; i <= maxGames; i++) {
                let scoreRow = `<tr><td>${i}</td>`;
                let pointRow = `<tr><td>${i}</td>`;
                for (let j = 1; j <= numPlayers; j++) {
                    scoreRow += `<td><input type="number" class="s-${i}-${j}" oninput="updateSum(${i})"></td>`;
                    pointRow += `<td><input type="number" id="p-${i}-${j}" class="pt-input" step="0.1" readonly></td>`;
                }
                scoreRow += `<td id="sum-${i}" class="sum-cell">0</td>`;
                scoreRow += `<td><select id="tobi-${i}" class="tobi-select"><option value="0">自動</option></select></td>`;
                scoreRow += `<td><button class="manual-btn" id="manual-btn-${i}" onclick="toggleManual(${i})">手入力</button></td></tr>`;
                
                pointRow += `</tr>`;
                scoreBody.innerHTML += scoreRow;
                pointBody.innerHTML += pointRow;
            }
            
            initChart(); // グラフの初期化

            document.getElementById('game-date').addEventListener('change', loadDateData);
            setupNameSync();
            updateTobiOptions();
            loadDateData();
        };

        // グラフの設定
        function initChart() {
            const ctx = document.getElementById('pointChart').getContext('2d');
            const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#f472b6']; // 6人分の線の色
            
            let datasets = [];
            for(let i=0; i<numPlayers; i++) {
                datasets.push({
                    label: `P${i+1}`,
                    data: [0],
                    borderColor: colors[i],
                    backgroundColor: colors[i],
                    tension: 0.1, // 直線にするか曲線にするか(0で完全な直線)
                    fill: false
                });
            }

            pointChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['開始'],
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { title: { display: true, text: '累計ポイント' } }
                    },
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        }

        function setupNameSync() {
            for (let i = 1; i <= numPlayers; i++) {
                document.getElementById(`p${i}-name`).addEventListener('input', (e) => {
                    document.querySelectorAll(`.p${i}-label`).forEach(el => el.innerText = e.target.value);
                    updateTobiOptions();
                });
            }
        }

        function updateTobiOptions() {
            for (let i = 1; i <= maxGames; i++) {
                let select = document.getElementById(`tobi-${i}`);
                let currentVal = select.value;
                select.innerHTML = `<option value="0">自動(トップ)</option>`;
                for (let j = 1; j <= numPlayers; j++) {
                    let name = document.getElementById(`p${j}-name`).value;
                    if (name) {
                        select.innerHTML += `<option value="${j}">${name}</option>`;
                    }
                }
                select.value = currentVal;
            }
        }

        function updateSum(rowIdx) {
            let sum = 0;
            for (let j = 1; j <= numPlayers; j++) {
                let val = document.querySelector(`.s-${rowIdx}-${j}`).value;
                if (val !== "") sum += parseInt(val);
            }
            let sumCell = document.getElementById(`sum-${rowIdx}`);
            sumCell.innerText = sum;
            
            const startPoint = parseInt(document.getElementById('start-point').value);
            if (sum === startPoint * 4) {
                sumCell.className = "sum-cell sum-ok";
            } else if (sum !== 0) {
                sumCell.className = "sum-cell sum-err";
            } else {
                sumCell.className = "sum-cell";
            }
        }

        function toggleManual(rowIdx) {
            manualRows[rowIdx] = !manualRows[rowIdx];
            const btn = document.getElementById(`manual-btn-${rowIdx}`);
            
            if (manualRows[rowIdx]) {
                btn.classList.add('active');
                btn.innerText = '手入力中';
                for (let j = 1; j <= numPlayers; j++) {
                    let pInput = document.getElementById(`p-${rowIdx}-${j}`);
                    pInput.removeAttribute('readonly');
                    pInput.classList.add('manual-mode');
                }
            } else {
                btn.classList.remove('active');
                btn.innerText = '手入力';
                for (let j = 1; j <= numPlayers; j++) {
                    let pInput = document.getElementById(`p-${rowIdx}-${j}`);
                    pInput.setAttribute('readonly', true);
                    pInput.classList.remove('manual-mode');
                }
                calculateAll(); 
            }
        }

        function calculateAll() {
            const start = parseInt(document.getElementById('start-point').value);
            const ret = parseInt(document.getElementById('return-point').value);
            const uma = document.getElementById('uma').value.split(',').map(Number);
            const rate = parseInt(document.getElementById('rate').value);
            const chipRate = parseInt(document.getElementById('chip-rate').value);
            const oka = (ret - start) * 4 / 1000;

            let totals = Array(numPlayers).fill(0);
            
            // グラフ用データ
            let chartLabels = ['開始'];
            let chartData = Array.from({length: numPlayers}, () => [0]);

            for (let i = 1; i <= maxGames; i++) {
                let isGamePlayed = false;
                let gamePts = Array(numPlayers).fill(0);

                if (manualRows[i]) {
                    // 【手入力モード】
                    for (let j = 1; j <= numPlayers; j++) {
                        let pVal = document.getElementById(`p-${i}-${j}`).value;
                        if (pVal !== "") {
                            gamePts[j - 1] = parseFloat(pVal);
                            isGamePlayed = true;
                        }
                    }
                } else {
                    // 【自動計算モード】
                    let activePlayers = [];
                    for (let j = 1; j <= numPlayers; j++) {
                        let val = document.querySelector(`.s-${i}-${j}`).value;
                        if (val !== "") {
                            activePlayers.push({ index: j, score: parseInt(val) });
                        }
                        document.getElementById(`p-${i}-${j}`).value = ""; 
                    }

                    if (activePlayers.length === 4) {
                        isGamePlayed = true;
                        activePlayers.sort((a, b) => b.score - a.score);
                        
                        let tobiCount = 0;
                        activePlayers.forEach((p, rankIdx) => {
                            let pt = (p.score - ret) / 1000 + uma[rankIdx];
                            if (rankIdx === 0) pt += oka; 
                            if (p.score < 0) {
                                pt -= 10;
                                tobiCount++;
                            }
                            p.pt = pt;
                        });

                        if (tobiCount > 0) {
                            let manualWinnerIdx = parseInt(document.getElementById(`tobi-${i}`).value);
                            let winner = activePlayers.find(p => p.index === manualWinnerIdx);
                            if (manualWinnerIdx > 0 && winner) {
                                winner.pt += (10 * tobiCount);
                            } else {
                                activePlayers[0].pt += (10 * tobiCount);
                            }
                        }

                        activePlayers.forEach(p => {
                            document.getElementById(`p-${i}-${p.index}`).value = p.pt.toFixed(1);
                            gamePts[p.index - 1] = p.pt;
                        });
                    }
                }

                // グラフデータの蓄積
                if (isGamePlayed) {
                    chartLabels.push(`${i}回戦`);
                    for (let j = 0; j < numPlayers; j++) {
                        totals[j] += gamePts[j];
                        chartData[j].push(totals[j]);
                    }
                }
            }

            // ポイントと金額の出力
            let moneys = [];
            for (let j = 1; j <= numPlayers; j++) {
                let chip = parseInt(document.getElementById(`chip${j}`).value) || 0;
                let finalPt = totals[j - 1];
                document.getElementById(`total-pt${j}`).innerText = finalPt.toFixed(1);
                
                let money = (finalPt * rate * 10) + (chip * chipRate);
                moneys.push(money);
                document.getElementById(`money${j}`).innerText = `¥${Math.round(money).toLocaleString()}`;
            }

            // グラフの更新
            if(pointChart) {
                pointChart.data.labels = chartLabels;
                for (let j = 0; j < numPlayers; j++) {
                    pointChart.data.datasets[j].data = chartData[j];
                    let name = document.getElementById(`p${j+1}-name`).value;
                    pointChart.data.datasets[j].label = name ? name : `P${j+1}`;
                }
                pointChart.update();
            }
            
            return { totals, moneys };
        }

        function saveCurrentData() {
            let calcResult = calculateAll();
            const date = document.getElementById('game-date').value;
            if (!date) return;

            let dayData = { 
                names: [], scores: [], chips: [], tobiWinners: [], 
                totals: calcResult.totals, moneys: calcResult.moneys,
                manualRows: [...manualRows], points: []
            };

            for (let j = 1; j <= numPlayers; j++) {
                dayData.names.push(document.getElementById(`p${j}-name`).value);
                dayData.chips.push(document.getElementById(`chip${j}`).value);
            }

            for (let i = 1; i <= maxGames; i++) {
                let rowScore = [];
                let rowPoint = [];
                for (let j = 1; j <= numPlayers; j++) {
                    rowScore.push(document.querySelector(`.s-${i}-${j}`).value);
                    rowPoint.push(document.getElementById(`p-${i}-${j}`).value);
                }
                dayData.scores.push(rowScore);
                dayData.points.push(rowPoint);
                dayData.tobiWinners.push(document.getElementById(`tobi-${i}`).value);
            }

            db[date] = dayData;
            localStorage.setItem('mahjongDB', JSON.stringify(db));
            alert(`${date} のデータを保存し、通算成績を更新しました！`);
            updateCumulativeStats();
        }

        function loadDateData() {
            const date = document.getElementById('game-date').value;
            const data = db[date];

            for (let i = 1; i <= maxGames; i++) {
                for (let j = 1; j <= numPlayers; j++) {
                    document.querySelector(`.s-${i}-${j}`).value = "";
                    document.getElementById(`p-${i}-${j}`).value = "";
                }
                document.getElementById(`tobi-${i}`).value = "0";
                
                manualRows[i] = false;
                let btn = document.getElementById(`manual-btn-${i}`);
                btn.classList.remove('active');
                btn.innerText = '手入力';
                for (let j = 1; j <= numPlayers; j++) {
                    let pInput = document.getElementById(`p-${i}-${j}`);
                    pInput.setAttribute('readonly', true);
                    pInput.classList.remove('manual-mode');
                }
                updateSum(i);
            }
            for (let j = 1; j <= numPlayers; j++) document.getElementById(`chip${j}`).value = "0";

            if (data) {
                for (let j = 1; j <= numPlayers; j++) {
                    document.getElementById(`p${j}-name`).value = data.names[j-1];
                    document.getElementById(`p${j}-name`).dispatchEvent(new Event('input')); 
                    document.getElementById(`chip${j}`).value = data.chips[j-1];
                }
                
                manualRows = data.manualRows || new Array(maxGames + 1).fill(false);
                
                for (let i = 1; i <= maxGames; i++) {
                    for (let j = 1; j <= numPlayers; j++) {
                        document.querySelector(`.s-${i}-${j}`).value = data.scores[i-1][j-1];
                    }
                    if(data.tobiWinners) document.getElementById(`tobi-${i}`).value = data.tobiWinners[i-1];
                    
                    if (manualRows[i]) {
                        let btn = document.getElementById(`manual-btn-${i}`);
                        btn.classList.add('active');
                        btn.innerText = '手入力中';
                        for (let j = 1; j <= numPlayers; j++) {
                            let pInput = document.getElementById(`p-${i}-${j}`);
                            pInput.removeAttribute('readonly');
                            pInput.classList.add('manual-mode');
                            if (data.points && data.points[i-1]) {
                                pInput.value = data.points[i-1][j-1];
                            }
                        }
                    }
                    updateSum(i);
                }
            }
            calculateAll();
            updateCumulativeStats();
        }

        function updateCumulativeStats() {
            let allStats = {};

            for (const date in db) {
                let d = db[date];
                if (!d.totals) continue; 
                
                for (let j = 0; j < numPlayers; j++) {
                    let name = d.names[j];
                    if (!name || name.trim() === "") continue;
                    if (!allStats[name]) allStats[name] = { games: 0, pt: 0, money: 0 };
                    
                    let games = 0;
                    d.scores.forEach(row => {
                        if (row[j] !== "") games++;
                    });
                    
                    allStats[name].games += games;
                    allStats[name].pt += (d.totals[j] || 0);
                    allStats[name].money += (d.moneys[j] || 0);
                }
            }

            const tbody = document.getElementById('cumulative-body');
            tbody.innerHTML = "";
            let hasData = false;
            for (const name in allStats) {
                let st = allStats[name];
                if (st.games > 0) {
                    hasData = true;
                    tbody.innerHTML += `<tr>
                        <td><strong>${name}</strong></td>
                        <td>${st.games} 半荘</td>
                        <td>${st.pt.toFixed(1)}</td>
                        <td style="color:#059669; font-weight:bold;">¥${Math.round(st.money).toLocaleString()}</td>
                    </tr>`;
                }
            }
            if (!hasData) {
                tbody.innerHTML = `<tr><td colspan="4">※「この日のデータを保存」ボタンを押すと通算成績が表示されます</td></tr>`;
            }
        }
    </script>
</body>
</html>
